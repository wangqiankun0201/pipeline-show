# 本地开发：H2 内存库（PostgreSQL 兼容模式），不连接 Nacos，启动时导入内置《内腐蚀数据.xlsx》
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pims_corrosion;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

pims:
  corrosion:
    seed-enabled: true
