# Nacos 配置：Data ID = pims-gis.yaml，Group = DEFAULT_GROUP，命名空间 = pims
spring:
  datasource:
    url: jdbc:postgresql://pims.postgresql.dev.xnyqt.petrochina:5432/pims?currentSchema=pims_gis
    username: pims
    # 密码使用 Nacos 加密配置或 K8s Secret 注入，禁止明文
    password: ${DB_PASSWORD}

pims:
  swagger:
    # 正式环境可关闭接口文档
    enabled: false
  map:
    center: [108.02, 30.64]
    zoom: 9
    # 内网环境使用天地图（tk 为天地图开发者密钥）或区域湖瓦片服务，前端无需改动
    basemaps:
      - key: vector
        name: 矢量地图
        url: http://t{0-7}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_TK:}
        annotation-url: http://t{0-7}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_TK:}
        attribution: © 天地图
      - key: image
        name: 影像地图
        url: http://t{0-7}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_TK:}
        annotation-url: http://t{0-7}.tianditu.gov.cn/cia_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=${TIANDITU_TK:}
        attribution: © 天地图
