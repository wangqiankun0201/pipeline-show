server:
  port: 9102

spring:
  application:
    name: pims-corrosion
  profiles:
    active: ${PIMS_PROFILE:local}
  mvc:
    pathmatch:
      # springfox 3 兼容 Spring Boot 2.6
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:nacos.dev.xnyqt.petrochina:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:pims}
      config:
        namespace: ${NACOS_NAMESPACE:pims}
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pims?currentSchema=pims_corrosion}
    username: ${DB_USERNAME:pims}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

pims:
  swagger:
    title: 内腐蚀趋势预测服务 pims-corrosion
  corrosion:
    model-name: 投运日起固定参数幂律模型
    model-version: V2.0-fixed
    attention-ratio: 0.8
    default-years-after-ili: 5
    curve-step-years: 0.5
    stale-inspection-years: 3
    short-service-years: 5
    seed-enabled: false
